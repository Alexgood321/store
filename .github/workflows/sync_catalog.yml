name: Sync Lampa plugin catalog

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog_seed.json'
      - 'sync_sources.json'
      - 'torrent_styles_v2.js'
      - 'scripts/sync_catalog.py'
      - '.github/workflows/sync_catalog.yml'

permissions:
  contents: write

concurrency:
  group: lampa-store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate and synchronize sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_catalog.py
      - name: Commit only real changes
        run: |
          git add live_catalog.json
          if git diff --cached --quiet; then
            echo "No new plugin revisions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize tracked Lampa plugin revisions"
          git pull --rebase origin main
          git push origin HEAD:main
