name: Sync Lampa plugin catalog

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog_seed.json'
      - 'sync_sources.json'
      - 'torrent_styles_v2.js'
      - 'my_store_runtime.js'
      - 'scripts/sync_catalog.py'
      - '.github/workflows/sync_catalog.yml'

permissions:
  contents: write

concurrency:
  group: lampa-store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Commit with retry against concurrent pushes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/sync_catalog.py
            git add live_catalog.json
            if git diff --cached --quiet; then
              echo "No new plugin revisions"
              exit 0
            fi
            git commit -m "chore: synchronize tracked Lampa plugin revisions"
            if git push origin HEAD:main; then
              echo "Catalog synchronized"
              exit 0
            fi
            echo "Concurrent push detected (attempt $attempt); retrying"
            sleep 3
          done
          echo "Unable to push after four attempts" >&2
          exit 1
