name: My Store runtime checks

on:
  push:
    branches: [main]
    paths:
      - 'my_store_loader.js'
      - 'my_store_runtime.js'
      - 'my_store_release.json'
      - 'live_catalog.json'
      - 'tests/store-versions.cjs'
      - 'tests/store-menu.cjs'
      - 'tests/store-central.cjs'
      - 'tests/store-version-colors.cjs'
      - 'tests/store-header-batch.cjs'
      - 'tests/store-back.cjs'
      - 'tests/store-diagnostics.cjs'
      - '.github/workflows/store-tests.yml'
  pull_request:
    paths:
      - 'my_store_loader.js'
      - 'my_store_runtime.js'
      - 'my_store_release.json'
      - 'live_catalog.json'
      - 'tests/store-versions.cjs'
      - 'tests/store-menu.cjs'
      - 'tests/store-central.cjs'
      - 'tests/store-version-colors.cjs'
      - 'tests/store-header-batch.cjs'
      - 'tests/store-back.cjs'
      - 'tests/store-diagnostics.cjs'
      - '.github/workflows/store-tests.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check my_store_loader.js
      - run: node --check my_store_runtime.js
      - run: node --check tests/store-versions.cjs
      - run: node tests/store-versions.cjs
      - run: node --check tests/store-menu.cjs
      - run: node tests/store-menu.cjs
      - run: node --check tests/store-central.cjs
      - run: node tests/store-central.cjs
      - run: node --check tests/store-version-colors.cjs
      - run: node tests/store-version-colors.cjs
      - run: node --check tests/store-header-batch.cjs
      - run: node tests/store-header-batch.cjs
      - run: node --check tests/store-back.cjs
      - run: node tests/store-back.cjs
      - run: node --check tests/store-diagnostics.cjs
      - run: node tests/store-diagnostics.cjs
      - run: python3 -m json.tool live_catalog.json > /dev/null
      - run: python3 -m json.tool my_store_release.json > /dev/null
